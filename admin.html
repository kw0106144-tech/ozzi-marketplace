<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم OZZI</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f5f7fa}
.admin-page{max-width:1250px;margin:30px auto;padding:0 20px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.admin-title h1{margin:0 0 6px}.admin-title p{margin:0;color:#777}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.admin-card,.panel{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.stat-label{color:#777;font-size:14px}.stat-value{font-size:30px;font-weight:900;margin-top:8px}
.section{margin-top:22px}.section h2{margin-bottom:14px}
.orders-table{width:100%;border-collapse:collapse}.orders-table th,.orders-table td{padding:12px;border-bottom:1px solid #eee;text-align:right;vertical-align:middle}.orders-table th{color:#777;font-size:13px}
.status-select,.shipping-input{padding:9px 10px;border:1px solid #ddd;border-radius:9px;font:inherit}
.shipping-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.shipping-card{border:1px solid #eee;border-radius:14px;padding:15px}
.shipping-card h3{margin:0 0 12px}
.switch-row{display:flex;align-items:center;gap:8px;margin:10px 0}
.save-btn{margin-top:10px}
.admin-message{display:none;padding:18px;border-radius:14px;background:#fff1f1;color:#b42318;margin-bottom:20px}.admin-message.show{display:block}
.success{background:#effcf6;color:#067647}
.muted{color:#777}
@media(max-width:1000px){.admin-grid{grid-template-columns:repeat(2,1fr)}.shipping-grid{grid-template-columns:repeat(2,1fr)}.orders-table{min-width:850px}.table-wrap{overflow:auto}}
@media(max-width:600px){.admin-grid,.shipping-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="site-header">
<div class="container"><nav class="nav">
<a class="logo" href="index.html">OZZI</a>
<div class="nav-actions">
<a class="btn btn-outline" href="index.html">المتجر</a>
<button class="btn btn-outline" type="button" onclick="logoutUser()">تسجيل الخروج</button>
</div>
</nav></div>
</header>

<main class="admin-page">
<div id="adminMessage" class="admin-message"></div>
<div class="admin-top">
<div class="admin-title"><h1>لوحة تحكم OZZI</h1><p>إدارة الطلبات والشحن والمتجر</p></div>
</div>

<section class="admin-grid">
<div class="admin-card"><div class="stat-label">إجمالي الطلبات</div><div class="stat-value" id="ordersCount">—</div></div>
<div class="admin-card"><div class="stat-label">قيد التنفيذ</div><div class="stat-value" id="pendingCount">—</div></div>
<div class="admin-card"><div class="stat-label">إجمالي المبيعات</div><div class="stat-value" id="salesTotal">—</div></div>
<div class="admin-card"><div class="stat-label">العملاء</div><div class="stat-value" id="customersCount">—</div></div>
</section>

<section class="section">
<h2>📦 إدارة الطلبات</h2>
<div class="panel table-wrap">
<table class="orders-table">
<thead><tr><th>رقم الطلب</th><th>العميل</th><th>الدولة</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th></tr></thead>
<tbody id="ordersBody"><tr><td colspan="6" class="muted">جاري التحميل...</td></tr></tbody>
</table>
</div>
</section>

<section class="section">
<h2>🚚 إعدادات الشحن</h2>
<div class="panel">
<p class="muted">يمكنك تحديد سعر الشحن أو تفعيل الشحن المجاني لكل دولة.</p>
<div id="shippingGrid" class="shipping-grid">جاري التحميل...</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(async function(){
const message=document.getElementById("adminMessage");
const countries={EG:"مصر",SA:"السعودية",AE:"الإمارات",IQ:"العراق",OM:"سلطنة عُمان"};

function showMessage(text,ok=false){
 message.textContent=text;
 message.className="admin-message show"+(ok?" success":"");
}
function money(v){return new Intl.NumberFormat("ar-EG").format(Number(v||0))+" ج.م";}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]));}

try{
const sb=window.ozziGetSupabase();
const {data:sessionData,error:sessionError}=await sb.auth.getSession();
if(sessionError||!sessionData.session){window.location.replace("login.html");return;}

const user=sessionData.session.user;
const {data:role,error:roleError}=await sb.from("admin_roles").select("role").eq("user_id",user.id).maybeSingle();

if(roleError||!role||!["admin","manager"].includes(role.role)){
 showMessage("ليس لديك صلاحية الدخول إلى لوحة التحكم.");
 setTimeout(()=>window.location.replace("index.html"),2200);
 return;
}

async function loadOrders(){
 const {data:orders,error}=await sb.from("orders").select("id,order_number,customer_name,country_code,status,total,created_at,user_id").order("created_at",{ascending:false});
 if(error) throw error;
 const list=orders||[];
 document.getElementById("ordersCount").textContent=list.length;
 document.getElementById("pendingCount").textContent=list.filter(o=>["pending","confirmed","shipped"].includes(o.status)).length;
 document.getElementById("salesTotal").textContent=money(list.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+Number(o.total||0),0));
 document.getElementById("customersCount").textContent=new Set(list.map(o=>o.user_id).filter(Boolean)).size;

 const body=document.getElementById("ordersBody");
 if(!list.length){body.innerHTML='<tr><td colspan="6" class="muted">لا توجد طلبات حتى الآن.</td></tr>';return;}
 body.innerHTML=list.map(o=>{
  const options=["pending","confirmed","shipped","delivered","cancelled"].map(s=>'<option value="'+s+'" '+(s===o.status?"selected":"")+">"+({pending:"قيد المراجعة",confirmed:"تم التأكيد",shipped:"تم الشحن",delivered:"تم التسليم",cancelled:"ملغي"}[s])+"</option>").join("");
  return '<tr><td>#'+esc(o.order_number)+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(countries[o.country_code]||o.country_code)+'</td><td>'+money(o.total)+'</td><td><select class="status-select" data-order="'+esc(o.id)+'">'+options+'</select></td><td>'+new Date(o.created_at).toLocaleDateString("ar-EG")+'</td></tr>';
 }).join("");

 body.querySelectorAll(".status-select").forEach(sel=>{
  sel.addEventListener("change",async()=>{
   const id=sel.dataset.order, status=sel.value;
   sel.disabled=true;
   const {error}=await sb.from("orders").update({status}).eq("id",id);
   sel.disabled=false;
   if(error){showMessage("تعذر تحديث حالة الطلب: "+error.message);await loadOrders();return;}
   showMessage("تم تحديث حالة الطلب بنجاح.",true);
   await loadOrders();
  });
 });
}

async function loadShipping(){
 const {data:rows,error}=await sb.from("shipping_settings").select("country_code,shipping_cost,free_shipping").order("country_code");
 if(error) throw error;
 document.getElementById("shippingGrid").innerHTML=(rows||[]).map(r=>'<div class="shipping-card"><h3>'+esc(countries[r.country_code]||r.country_code)+'</h3><label>سعر الشحن</label><input class="shipping-input" type="number" min="0" step="0.01" value="'+esc(r.shipping_cost)+'" data-country="'+esc(r.country_code)+'"><label class="switch-row"><input type="checkbox" '+(r.free_shipping?"checked":"")+' data-free="'+esc(r.country_code)+'"> شحن مجاني</label><button class="btn btn-primary save-btn" data-save="'+esc(r.country_code)+'">حفظ</button></div>').join("");

 document.querySelectorAll("[data-save]").forEach(btn=>btn.addEventListener("click",async()=>{
  const code=btn.dataset.save;
  const input=document.querySelector('.shipping-input[data-country="'+code+'"]');
  const free=document.querySelector('[data-free="'+code+'"]');
  const cost=Math.max(0,Number(input.value||0));
  btn.disabled=true;
  const {error}=await sb.from("shipping_settings").update({shipping_cost:cost,free_shipping:free.checked,updated_at:new Date().toISOString()}).eq("country_code",code);
  btn.disabled=false;
  if(error){showMessage("تعذر حفظ إعداد الشحن: "+error.message);return;}
  showMessage("تم حفظ إعدادات الشحن لـ "+(countries[code]||code)+" بنجاح.",true);
  await loadShipping();
 }));
}

await loadOrders();
await loadShipping();
}catch(err){
 console.error("OZZI ADMIN ERROR:",err);
 showMessage("حدث خطأ أثناء تحميل لوحة التحكم: "+(err.message||"خطأ غير معروف"));
}
})();
</script>
</body>
</html>
