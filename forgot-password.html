<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور | OZZI</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<main class="auth-page"><section class="auth-card">
<div class="auth-logo">OZZI</div><p class="auth-slogan">More than store</p>
<h1>نسيت كلمة المرور؟</h1>
<p class="auth-description">اكتب بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p>
<form id="forgotForm">
<div class="form-group"><label for="forgotEmail">البريد الإلكتروني</label><input id="forgotEmail" type="email" placeholder="example@email.com" autocomplete="email" required></div>
<button type="submit" class="auth-button" id="forgotButton">إرسال رابط إعادة التعيين</button>
<p id="forgotMessage" class="auth-message"></p>
</form>
<div class="auth-footer"><span>تذكرت كلمة المرور؟</span><a href="login.html">تسجيل الدخول</a></div>
<a href="index.html" class="back-home">العودة إلى المتجر</a>
</section></main>
<script>
document.getElementById("forgotForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const email=document.getElementById("forgotEmail").value.trim().toLowerCase();
  const btn=document.getElementById("forgotButton");
  const msg=document.getElementById("forgotMessage");
  btn.disabled=true;
  btn.textContent="جاري الإرسال...";
  msg.className="auth-message";
  msg.textContent="";
  try{
    const sb=window.ozziGetSupabase();
    const redirectTo=new URL("reset-password.html",window.location.href).href;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
    if(error) throw error;
    msg.textContent="تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.";
    msg.className="auth-message success";
  }catch(error){
    console.error("OZZI Password Reset Request Error:",error);
    msg.textContent="تعذر إرسال الرابط. تأكد من البريد الإلكتروني وحاول مرة أخرى.";
  }finally{
    btn.disabled=false;
    btn.textContent="إرسال رابط إعادة التعيين";
  }
});
</script>
</body>
</html>
