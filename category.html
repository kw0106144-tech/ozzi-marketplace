<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OZZI | القسم</title>
<style>
:root{--p:#1B91B7;--dark:#071923;--bg:#F5FAFC;--text:#10212B;--muted:#607985;--border:#DCEBF0}
*{box-sizing:border-box}body{margin:0;font-family:"Tajawal",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 28px));margin:auto}
header{background:var(--dark);color:#fff;padding:16px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:30px;font-weight:900;letter-spacing:2px}.actions{display:flex;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:11px;border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:900}.primary{background:var(--p);border-color:var(--p)}
main{padding:35px 0 70px}.head{background:#fff;border:1px solid var(--border);border-radius:22px;padding:25px;margin-bottom:24px;box-shadow:0 10px 30px rgba(7,25,35,.06)}.head h1{margin:0 0 5px;font-size:32px}.head p{margin:0;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:.2s;box-shadow:0 5px 20px rgba(7,25,35,.04)}.product:hover{transform:translateY(-4px)}.product-image{height:210px;background:#eef9fc;display:grid;place-items:center}.product-image img{width:100%;height:100%;object-fit:contain}.body{padding:16px}.cat{font-size:12px;color:var(--muted)}.name{font-size:18px;font-weight:900;margin:5px 0 10px;line-height:1.5}.price{font-size:20px;font-weight:900;color:#08789D}.old{text-decoration:line-through;color:#899;font-size:13px;margin-right:6px}.discount{display:inline-block;background:#E5484D;color:#fff;padding:3px 7px;border-radius:999px;font-size:11px;margin-top:7px}.empty,.loading{background:#fff;border:1px solid var(--border);border-radius:18px;padding:45px;text-align:center;color:var(--muted)}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.products{gap:10px}.product-image{height:170px}.name{font-size:15px}.head h1{font-size:25px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">OZZI</a><div class="actions"><a class="btn" href="cart.html">السلة</a><a class="btn primary" href="index.html">المتجر</a></div></div></header>
<main class="container">
<section class="head"><h1 id="title">القسم</h1><p id="subtitle">منتجات القسم المتاحة في دولتك</p></section>
<div id="products" class="products"><div class="loading">جاري تحميل المنتجات...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script>
<script>
(async function(){
const params=new URLSearchParams(location.search),category=params.get("category");
const grid=document.getElementById("products"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle");
const symbols={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};
const session=(await window.ozziGetSupabase().auth.getSession()).data.session;
const country=String(session?.user?.user_metadata?.country_code||localStorage.getItem("ozzi_country")||"EG").toUpperCase();
const symbol=symbols[country]||"ج.م";const money=v=>new Intl.NumberFormat("ar-EG",{maximumFractionDigits:0}).format(Math.round(Number(v)||0));
if(!category){grid.innerHTML='<div class="empty">لم يتم تحديد القسم.</div>';throw new Error("No category");}
title.textContent=category;subtitle.textContent="منتجات "+category+" المتاحة في "+({EG:"مصر",SA:"السعودية",AE:"الإمارات",IQ:"العراق",OM:"سلطنة عُمان"}[country]||country);
try{
const sb=window.ozziGetSupabase();
const {data,error}=await sb.from("products").select("id,name,name_ar,category,price,original_price,image_url,stock,country_code,active").eq("active",true).eq("country_code",country).eq("category",category).gt("stock",0).order("created_at",{ascending:false});
if(error)throw error;
if(!data?.length){grid.innerHTML='<div class="empty">لا توجد منتجات متاحة في هذا القسم حاليًا.</div>';return;}
grid.innerHTML=data.map(p=>{const n=p.name_ar||p.name||"منتج",d=Number(p.original_price)>Number(p.price);return '<a class="product" href="product.html?id='+encodeURIComponent(p.id)+'"><div class="product-image">'+(p.image_url?'<img src="'+p.image_url.replace(/"/g,"&quot;")+'" alt="'+n.replace(/"/g,"&quot;")+'">':'🛍️')+'</div><div class="body"><div class="cat">'+p.category+'</div><div class="name">'+n+'</div><div class="price">'+money(p.price)+" "+symbol+(d?'<span class="old">'+money(p.original_price)+" "+symbol+"</span>":"")+'</div>'+(d?'<span class="discount">خصم '+Math.round((1-p.price/p.original_price)*100)+'%</span>':"")+'</div></a>';}).join("");
}catch(e){console.error(e);grid.innerHTML='<div class="empty">تعذر تحميل منتجات القسم.</div>';}
})();
</script>
</body></html>
