<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OZZI | تفاصيل المنتج</title>
<style>
:root{--p:#1B91B7;--dark:#071923;--bg:#F5FAFC;--muted:#607985;--border:#DCEBF0}
*{box-sizing:border-box}body{margin:0;font-family:"Tajawal",Tahoma,Arial,sans-serif;background:var(--bg);color:#10212B}.container{width:min(1120px,calc(100% - 28px));margin:auto}
header{background:var(--dark);color:#fff;padding:16px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:30px;font-weight:900;letter-spacing:2px}.actions{display:flex;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:11px;text-decoration:none;border:1px solid rgba(255,255,255,.2);color:#fff;background:transparent;font-weight:800;cursor:pointer}.cart-btn{gap:7px;position:relative}.cart-icon{width:24px;height:24px;display:block;flex:0 0 auto}.cart-count{min-width:21px;height:21px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#E5484D;color:#fff;font-size:12px;font-weight:900;line-height:1}.primary{background:var(--p);border-color:var(--p)}
main{padding:35px 0}.product-page{display:grid;grid-template-columns:1fr 1fr;gap:35px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:0 15px 40px rgba(7,25,35,.07)}
.gallery-main{height:470px;border-radius:18px;background:#eef9fc;display:grid;place-items:center;position:relative;overflow:hidden}.gallery-main img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:10px;overflow:auto;margin-top:12px}.thumb{width:78px;height:78px;flex:0 0 auto;border:2px solid transparent;border-radius:10px;background:#eef9fc;cursor:pointer;overflow:hidden}.thumb.active{border-color:var(--p)}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px}.category{color:var(--muted);font-size:14px}.title{font-size:34px;margin:8px 0 15px}.price{font-size:30px;font-weight:900;color:#08789D}.old{font-size:15px;color:#899;text-decoration:line-through;margin-top:3px}.discount{display:inline-block;background:#E5484D;color:#fff;padding:6px 10px;border-radius:999px;font-weight:800;margin:12px 0}.desc{color:#536A73;line-height:1.9;margin:20px 0}.stock{font-weight:800;margin:15px 0}.qty{display:flex;align-items:center;gap:10px;margin:18px 0}.qty button{width:40px;height:40px;border:1px solid var(--border);background:#fff;border-radius:9px;cursor:pointer;font-size:20px}.qty span{min-width:35px;text-align:center;font-weight:900}.buy-cart-icon{display:inline-flex;vertical-align:middle;margin-left:7px}.buy-cart-icon svg{width:22px;height:22px;display:block}.buy{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;border:0;border-radius:13px;background:var(--p);color:#fff;padding:15px;font-weight:900;font-size:17px;cursor:pointer}.buy-now{margin-top:10px;background:#071923}.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.share-btn{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--dark);padding:13px;font-weight:900;cursor:pointer}.share-btn svg{width:20px;height:20px}.message{margin-top:15px;padding:12px;border-radius:10px;background:#eef9fc;color:#08789D;display:none}.similar-section{margin-top:32px}.similar-head{margin-bottom:18px}.similar-head h2{margin:0 0 5px;font-size:28px}.similar-head p{margin:0;color:var(--muted)}.similar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.similar-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(7,25,35,.06);text-decoration:none;color:inherit;display:flex;flex-direction:column}.similar-image{height:210px;background:#eef9fc;display:grid;place-items:center}.similar-image img{width:100%;height:100%;object-fit:contain}.similar-body{padding:14px}.similar-category{font-size:12px;color:var(--muted)}.similar-name{font-size:17px;font-weight:900;margin:5px 0 10px;line-height:1.5}.similar-price{font-size:19px;font-weight:900;color:#08789D}.similar-old{font-size:12px;color:#899;text-decoration:line-through;margin-right:6px}.similar-discount{display:inline-block;background:#E5484D;color:#fff;padding:3px 7px;border-radius:999px;font-size:11px;margin-top:6px}@media(max-width:900px){.similar-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.similar-grid{grid-template-columns:1fr 1fr}.similar-image{height:160px}.similar-name{font-size:15px}}
.loading,.error{text-align:center;background:#fff;padding:50px;border-radius:20px;border:1px solid var(--border)}
@media(max-width:800px){.product-page{grid-template-columns:1fr}.gallery-main{height:350px}.title{font-size:28px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html">OZZI</a><div class="actions">
<a class="btn cart-btn" href="cart.html" aria-label="سلة التسوق" title="السلة">
<svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="18" cy="20" r="1.6" fill="currentColor"/></svg>
<span>السلة</span><span id="cartCount" class="cart-count">0</span>
</a><a class="btn primary" href="index.html">المتجر</a></div></div></header>
<main class="container">
<div id="loading" class="loading">جاري تحميل المنتج...</div>
<div id="error" class="error" style="display:none"></div>
<section id="productPage" class="product-page" style="display:none">
<div><div id="mainImage" class="gallery-main"></div><div id="thumbs" class="thumbs"></div></div>
<div class="info">
<div id="category" class="category"></div><h1 id="title" class="title"></h1><div id="discount"></div><div id="price" class="price"></div><div id="oldPrice" class="old"></div><div id="description" class="desc"></div>
<div class="qty"><button id="minus" type="button">−</button><span id="qty">1</span><button id="plus" type="button">+</button></div>
<button id="buy" class="buy" type="button"><span class="buy-cart-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="18" cy="20" r="1.6" fill="currentColor"/></svg></span>أضف للسلة</button><button id="buyNow" class="buy buy-now" type="button">شراء الآن</button><div class="product-actions"><button id="favoriteProduct" class="share-btn" type="button">♡ إضافة للمفضلة</button><button id="shareProduct" class="share-btn" type="button"><svg viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/><path d="M8.7 10.7l6.6-3.9M8.7 13.3l6.6 3.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>مشاركة المنتج</button><button id="copyProduct" class="share-btn" type="button"><svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg>نسخ الرابط</button></div><div id="message" class="message"></div>
</div></section>
<section id="similarSection" class="similar-section" style="display:none">
<div class="similar-head"><h2>منتجات مشابهة</h2><p>منتجات هتعجبك</p></div>
<div id="similarGrid" class="similar-grid"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/favorites.js"></script><script src="js/cart.js"></script>
<script>
(async function(){
const id=new URLSearchParams(location.search).get("id");
const loading=document.getElementById("loading"),errorBox=document.getElementById("error"),page=document.getElementById("productPage");
const countryNames={EG:"مصر",SA:"السعودية",AE:"الإمارات",IQ:"العراق",OM:"سلطنة عُمان"};
const symbols={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};
const money=v=>new Intl.NumberFormat("ar-EG",{maximumFractionDigits:0}).format(Math.round(Number(v)||0));
function updateCartCount(){const el=document.getElementById("cartCount");if(el)el.textContent=window.ozziCart?window.ozziCart.cartCount():0;}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
try{
if(!id)throw new Error("لم يتم تحديد المنتج.");
const sb=window.ozziGetSupabase();
const session=(await sb.auth.getSession()).data.session;
const accountCountry=String(session?.user?.user_metadata?.country_code||localStorage.getItem("ozzi_country")||"EG").toUpperCase();
const {data:p,error:e}=await sb.from("products").select("id,name,name_ar,name_en,category,description,price,original_price,image_url,stock,country_code,active").eq("id",id).eq("active",true).single();
if(e)throw e;if(!p)throw new Error("المنتج غير موجود.");
if(p.country_code!==accountCountry)throw new Error("هذا المنتج غير متاح في دولة حسابك.");
const {data:imgs,error:ie}=await sb.from("product_images").select("image_url,sort_order").eq("product_id",id).order("sort_order");
if(ie)throw ie;
const images=[p.image_url,...(imgs||[]).map(x=>x.image_url)].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
const symbol=symbols[p.country_code]||"ج.م";const name=p.name_ar||p.name||"منتج";const hasDiscount=Number(p.original_price)>Number(p.price);
document.getElementById("category").textContent=p.category||"عام";document.getElementById("title").textContent=name;
document.getElementById("price").textContent=money(p.price)+" "+symbol;
document.getElementById("oldPrice").textContent=hasDiscount?money(p.original_price)+" "+symbol:"";
const savedAmount=hasDiscount?Math.max(0,Number(p.original_price)-Number(p.price)):0;
document.getElementById("discount").innerHTML=hasDiscount?'<span class="discount">خصم '+Math.round((1-p.price/p.original_price)*100)+'%</span><div style="margin-top:6px;color:#16824A;font-weight:900">وفّر '+money(savedAmount)+" "+symbol+"</div>":"";
document.getElementById("description").textContent=p.description||"لا يوجد وصف إضافي لهذا المنتج.";

let qty=1;const qtyEl=document.getElementById("qty");const setQty=v=>{qty=Math.max(1,Math.min(Number(p.stock||1),v));qtyEl.textContent=qty};document.getElementById("minus").onclick=()=>setQty(qty-1);document.getElementById("plus").onclick=()=>setQty(qty+1);
const main=document.getElementById("mainImage"),thumbs=document.getElementById("thumbs");
function setImage(src,index){main.innerHTML=src?'<img src="'+esc(src)+'" alt="'+esc(name)+'">':'<span style="font-size:70px">🛍️</span>';thumbs.querySelectorAll(".thumb").forEach((x,i)=>x.classList.toggle("active",i===index));}
thumbs.innerHTML=images.map((src,i)=>'<button class="thumb '+(i===0?"active":"")+'" type="button" data-i="'+i+'"><img src="'+esc(src)+'" alt=""></button>').join("");
thumbs.querySelectorAll(".thumb").forEach(b=>b.onclick=()=>setImage(images[Number(b.dataset.i)],Number(b.dataset.i)));setImage(images[0]||"",0);
async function setupFavorite(){const btn=document.getElementById("favoriteProduct");if(!btn)return;try{await window.ozziFavorites.load();const sync=()=>{const saved=window.ozziFavorites.has(p.id);btn.textContent=saved?"♥ إزالة من المفضلة":"♡ إضافة للمفضلة";};sync();btn.onclick=async()=>{try{await window.ozziFavorites.toggle(p.id);sync();document.getElementById("message").textContent="تم تحديث المفضلة ❤️";}catch(e){if(e.message==="LOGIN_REQUIRED")location.href="login.html";else document.getElementById("message").textContent="تعذر تحديث المفضلة.";}}}catch(e){console.error("Favorites error:",e)}}
async function loadSimilarProducts(){
const section=document.getElementById("similarSection"),grid=document.getElementById("similarGrid");
try{
const {data:similar,error:se}=await sb.from("products").select("id,name,name_ar,category,price,original_price,image_url,stock,country_code,active").eq("active",true).eq("country_code",p.country_code).eq("category",p.category).neq("id",p.id).gt("stock",0).order("created_at",{ascending:false}).limit(8);
if(se)throw se;if(!similar||!similar.length)return;
grid.innerHTML=similar.map(x=>{const n=x.name_ar||x.name||"منتج";const d=Number(x.original_price)>Number(x.price);return '<a class="similar-card" href="product.html?id='+encodeURIComponent(x.id)+'"><div class="similar-image">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(n)+'">':'<span style="font-size:55px">🛍️</span>')+'</div><div class="similar-body"><div class="similar-category">'+esc(x.category||"عام")+'</div><div class="similar-name">'+esc(n)+'</div><div class="similar-price">'+money(x.price)+" "+symbol+(d?'<span class="similar-old">'+money(x.original_price)+" "+symbol+"</span>":"")+'</div>'+(d?'<span class="similar-discount">خصم '+Math.round((1-x.price/x.original_price)*100)+'%</span>':"")+'</div></a>';}).join("");section.style.display="block";
}catch(err){console.error("Similar products error:",err);}
}
function addCurrentToCart(){window.ozziCart.addToCart({id:p.id,name,category:p.category||"عام",price:Number(p.price),image:images[0]||"",currency:symbol,country_code:p.country_code,quantity:qty});}
document.getElementById("buy").onclick=()=>{addCurrentToCart();document.getElementById("message").style.display="block";document.getElementById("message").textContent="تمت إضافة المنتج إلى السلة";};
document.getElementById("buyNow").onclick=()=>{addCurrentToCart();window.location.href="cart.html";};
document.getElementById("shareProduct").onclick=async()=>{const url=location.href;try{if(navigator.share){await navigator.share({title:name,text:"شوف المنتج ده على OZZI",url});}else{await navigator.clipboard.writeText(url);document.getElementById("message").style.display="block";document.getElementById("message").textContent="تم نسخ رابط المنتج";}}catch(err){if(err.name!=="AbortError")console.error(err);}};
document.getElementById("copyProduct").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById("message").style.display="block";document.getElementById("message").textContent="تم نسخ رابط المنتج";}catch(err){console.error(err);}};
loading.style.display="none";page.style.display="grid";updateCartCount();loadSimilarProducts();setupFavorite();window.addEventListener("ozzi:cart-updated",updateCartCount);
}catch(e){console.error(e);loading.style.display="none";errorBox.style.display="block";errorBox.textContent=e.message||"تعذر تحميل المنتج.";}
})();
</script>
</body></html>
