<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات - OZZI</title><link rel="stylesheet" href="css/style.css"><style>body{font-family:Tajawal,Arial,sans-serif;font-weight:900}.notifications-wrap{max-width:900px;margin:30px auto;padding:0 18px}.notifications-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.notification{padding:18px;border:1px solid #e7ecef;border-radius:18px;background:#fff;margin-bottom:12px;cursor:pointer}.notification.unread{border-right:4px solid #08789d;background:#f5fbfd}.notification-title{font-size:17px;margin-bottom:6px}.notification-message{color:#555;line-height:1.8}.notification-date{font-size:11px;color:#8a8f94;margin-top:8px}.empty{padding:50px;text-align:center;border:1px dashed #ccd5da;border-radius:18px}</style></head><body><header class="site-header"><div class="container nav"><a href="index.html" class="brand">OZZI</a><div class="nav-actions"><a class="btn btn-outline" href="index.html">المتجر</a><a class="btn btn-outline" href="favorites.html">❤️ المفضلة</a><a class="btn btn-outline" href="notifications.html">🔔 الإشعارات</a></div></div></header><main class="notifications-wrap"><div class="notifications-head"><div><h1>🔔 الإشعارات</h1><p>آخر تحديثات حسابك وطلباتك وعروض OZZI</p></div><button id="markAll" class="btn btn-outline">تحديد الكل كمقروء</button></div><div id="list"><div class="empty">جاري تحميل الإشعارات...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/notifications.js"></script><script>(async()=>{const list=document.getElementById("list");const sb=window.ozziGetSupabase();const {data:s}=await sb.auth.getSession();if(!s.session){list.innerHTML='<div class="empty">سجّل الدخول أولًا لعرض الإشعارات.<br><br><a href="login.html">تسجيل الدخول</a></div>';return}const uid=s.session.user.id;async function load(){const {data,error}=await sb.from("notifications").select("id,type,title,message,is_read,created_at,product_id,order_id").eq("user_id",uid).order("created_at",{ascending:false}).limit(100);if(error){list.innerHTML='<div class="empty">تعذر تحميل الإشعارات.</div>';return}list.innerHTML=data?.length?data.map(n=>'<div class="notification '+(!n.is_read?'unread':'')+'" data-id="'+n.id+'"><div class="notification-title">'+n.title+'</div><div class="notification-message">'+n.message+'</div><div class="notification-date">'+new Date(n.created_at).toLocaleString("ar-EG")+'</div></div>').join(""):'<div class="empty">لا توجد إشعارات حاليًا.</div>';list.querySelectorAll("[data-id]").forEach(el=>el.onclick=async()=>{await window.ozziNotifications.markRead(el.dataset.id);el.classList.remove("unread")})}document.getElementById("markAll").onclick=async()=>{await window.ozziNotifications.markAllRead();load()};load()})();</script></body></html>
