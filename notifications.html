<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإشعارات | OZZI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<style>
body{background:#f6f8fa}
.notifications-page{padding:32px 0 70px}
.notifications-wrap{max-width:980px;margin:auto}
.notifications-card{background:#fff;border:1px solid #e7ebee;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(7,25,35,.07)}
.notifications-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px;border-bottom:1px solid #edf0f2}
.notifications-title h1{margin:0;color:#071923;font-size:28px;font-weight:900}
.notifications-title p{margin:7px 0 0;color:#78848a;font-size:13px}
#markAll{border:0;border-radius:12px;background:#071923;color:#fff;padding:11px 16px;font-weight:900;cursor:pointer}
#markAll:disabled{opacity:.5}
#list{padding:10px}
.notification{display:flex;gap:14px;align-items:flex-start;padding:18px;border-bottom:1px solid #eef1f3;border-radius:16px;cursor:pointer}
.notification:last-child{border-bottom:0}
.notification:hover{background:#f8fafb}
.notification.unread{background:#eefaff}
.notification-icon{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#071923;color:#fff;display:grid;place-items:center;font-size:21px}
.notification-body{flex:1;min-width:0}
.notification-title{font-weight:900;color:#071923;font-size:15px}
.notification-message{margin-top:5px;color:#5f6b72;font-size:13px;line-height:1.8}
.notification-time{margin-top:7px;color:#9aa3a8;font-size:11px}
.notification-dot{width:9px;height:9px;flex:0 0 9px;margin-top:8px;border-radius:50%;background:#08a6d5}
.empty,.error{padding:55px 20px;text-align:center;color:#7b858b}
.error{color:#b42318}
@media(max-width:650px){.notifications-page{padding:20px 0 45px}.notifications-head{align-items:stretch;flex-direction:column;padding:18px}.notifications-title h1{font-size:23px}#markAll{width:100%}.notification{padding:15px 8px}}
</style>
</head>
<body>
<header class="site-header">
<div class="container nav">
<a class="brand" href="index.html"><span class="brand-text">OZZI</span><span class="brand-text">MORE THAN STORE</span></a>
<div class="nav-actions">
<a class="btn btn-outline cart-link cart-icon-btn" href="cart.html" aria-label="السلة">🛒<span id="cartCount" class="cart-count">0</span></a>
<a class="btn btn-outline" href="orders.html">📦 طلباتي</a>
<a class="btn btn-outline" href="favorites.html">❤️ المفضلة</a>
<a class="btn btn-primary" href="notifications.html">🔔 الإشعارات <span id="headerNotificationCount" class="cart-count" style="display:none">0</span></a>
<a class="btn btn-primary" href="profile.html">👤 الملف الشخصي</a>
</div>
</div>
</header>

<main class="container notifications-page">
<div class="notifications-wrap">
<section class="notifications-card">
<div class="notifications-head">
<div class="notifications-title"><h1>🔔 الإشعارات</h1><p>آخر التحديثات الخاصة بحسابك وطلباتك</p></div>
<button id="markAll" type="button">تحديد الكل كمقروء</button>
</div>
<div id="list"><div class="empty">جاري تحميل الإشعارات...</div></div>
</section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
(function(){
const list=document.getElementById("list"), markAll=document.getElementById("markAll"), badge=document.getElementById("headerNotificationCount");
let sb=null,uid=null;
const icons={order_status:"📦",discount:"🏷️",product_arrival:"🛍️"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function time(v){try{return new Intl.DateTimeFormat("ar-EG",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch{return ""}}
async function unreadCount(){
 const r=await sb.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",uid).eq("is_read",false);
 if(r.error) throw r.error;
 badge.textContent=r.count||0; badge.style.display=r.count?"inline-flex":"none";
}
async function load(){
 const r=await sb.from("notifications").select("id,type,title,message,is_read,created_at,product_id,order_id").eq("user_id",uid).order("created_at",{ascending:false}).limit(100);
 if(r.error) throw r.error;
 if(!r.data?.length){list.innerHTML='<div class="empty"><div style="font-size:44px">🔔</div><div>لا توجد إشعارات حاليًا</div></div>';markAll.disabled=true}
 else{
  markAll.disabled=false;
  list.innerHTML=r.data.map(n=>'<article class="notification '+(n.is_read?"":"unread")+'" data-id="'+esc(n.id)+'"><div class="notification-icon">'+(icons[n.type]||"🔔")+'</div><div class="notification-body"><div class="notification-title">'+esc(n.title)+'</div><div class="notification-message">'+esc(n.message)+'</div><div class="notification-time">'+time(n.created_at)+'</div></div>'+(n.is_read?"":'<span class="notification-dot"></span>')+'</article>').join("");
  list.querySelectorAll("[data-id]").forEach(el=>el.addEventListener("click",async()=>{
   if(!el.classList.contains("unread"))return;
   const id=el.dataset.id;
   const r=await sb.from("notifications").update({is_read:true}).eq("id",id).eq("user_id",uid);
   if(!r.error){el.classList.remove("unread");el.querySelector(".notification-dot")?.remove();await unreadCount()}
  }));
 }
 await unreadCount();
}
async function init(){
 try{
  sb=window.ozziGetSupabase();
  const s=await sb.auth.getSession();
  if(!s.data.session){window.location.replace("login.html?redirect=notifications.html");return}
  uid=s.data.session.user.id;
  markAll.addEventListener("click",async()=>{
   markAll.disabled=true;
   const r=await sb.from("notifications").update({is_read:true}).eq("user_id",uid).eq("is_read",false);
   if(r.error){console.error(r.error);markAll.disabled=false;return}
   await load();
  });
  await load();
  sb.channel("ozzi-notifications-page-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+uid},()=>load()).subscribe();
 }catch(e){console.error(e);list.innerHTML='<div class="error">تعذر تحميل الإشعارات. تأكد من إعداد جدول notifications في Supabase.</div>'}
}
document.addEventListener("DOMContentLoaded",init);
})();
</script>
</body>
</html>
