<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إنشاء حساب | OZZI</title>

    <link rel="stylesheet" href="css/style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer>
    </script>

    <script src="js/config.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">
                OZZI
            </div>

            <p class="auth-slogan">
                More than store
            </p>

            <h1>
                إنشاء حساب
            </h1>

            <p class="auth-description">
                انضم إلى OZZI وابدأ التسوق
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="registerName">
                        الاسم بالكامل
                    </label>

                    <input
                        id="registerName"
                        type="text"
                        placeholder="اكتب اسمك بالكامل"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPhone">
                        رقم الهاتف
                    </label>

                    <input
                        id="registerPhone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerCountry">
                        الدولة
                    </label>

                    <select
                        id="registerCountry"
                        required
                    >

                        <option value="">
                            اختر الدولة
                        </option>

                        <option value="EG">
                            🇪🇬 مصر
                        </option>

                        <option value="SA">
                            🇸🇦 السعودية
                        </option>

                        <option value="AE">
                            🇦🇪 الإمارات
                        </option>

                        <option value="IQ">
                            🇮🇶 العراق
                        </option>

                        <option value="OM">
                            🇴🇲 سلطنة عُمان
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        البريد الإلكتروني
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        كلمة المرور
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="8 أحرف على الأقل"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPasswordConfirm">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        id="registerPasswordConfirm"
                        type="password"
                        placeholder="أعد كتابة كلمة المرور"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    إنشاء الحساب
                </button>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>

            </form>


            <div class="auth-footer">

                <span>
                    لديك حساب بالفعل؟
                </span>

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                العودة إلى المتجر
            </a>

        </section>

    </main>

</body>

</html>
