<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي | OZZI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .orders-page{max-width:1100px;margin:40px auto;padding:0 20px}
    .orders-header{margin-bottom:24px}
    .orders-header h1{margin:0 0 8px}
    .orders-header p{margin:0;color:#777}
    .orders-card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.05);margin-bottom:18px}
    .orders-loading,.orders-empty,.orders-error{text-align:center;padding:45px 20px}
    .orders-empty h2{margin-top:0}
    .order-card{background:#fff;border:1px solid #e7e7e7;border-radius:18px;padding:20px;margin-bottom:16px}
    .order-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    .order-number{font-size:20px;font-weight:900}
    .order-date{color:#777;font-size:13px;margin-top:5px}
    .order-status{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800}
    .status-pending{background:#fff7e6;color:#9a6700}
    .status-confirmed{background:#eef4ff;color:#175cd3}
    .status-shipped{background:#f0f9ff;color:#026aa2}
    .status-delivered{background:#ecfdf3;color:#067647}
    .status-cancelled{background:#fff1f1;color:#b42318}
    .order-timeline{display:flex;align-items:flex-start;gap:0;margin:22px 0 8px;padding:16px 8px;background:#fafafa;border-radius:16px;overflow:auto}
    .timeline-step{position:relative;flex:1;min-width:105px;text-align:center;color:#aaa}
    .timeline-step:not(:last-child)::after{content:"";position:absolute;top:15px;right:50%;width:100%;height:3px;background:#e5e7eb;z-index:0}
    .timeline-dot{position:relative;z-index:1;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;color:#777;font-weight:900;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.08)}
    .timeline-step.done{color:#067647}.timeline-step.done .timeline-dot{background:#067647;color:#fff}.timeline-step.done:not(:last-child)::after{background:#067647}
    .timeline-step.current{color:#175cd3;font-weight:900}.timeline-step.current .timeline-dot{background:#175cd3;color:#fff}
    .timeline-step.cancelled{color:#b42318}.timeline-step.cancelled .timeline-dot{background:#b42318;color:#fff}
    .timeline-label{font-size:11px;line-height:1.4;white-space:nowrap}
    .order-updated{margin-top:10px;color:#777;font-size:12px}
    .order-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0;padding:15px;background:#fafafa;border-radius:14px}
    .order-info div{min-width:0}
    .order-info span{display:block;color:#777;font-size:12px;margin-bottom:5px}
    .order-info strong{display:block;overflow-wrap:anywhere}
    .order-items{border-top:1px solid #eee;margin-top:16px;padding-top:8px}
    .order-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
    .order-item:last-child{border-bottom:0}
    .order-item img{width:60px;height:60px;object-fit:cover;border-radius:10px;background:#f5f5f5;flex:none}
    .order-item-info{flex:1}
    .order-item-name{font-weight:800}
    .order-item-meta{font-size:13px;color:#777;margin-top:4px}
    .order-item-total{font-weight:800;white-space:nowrap}
    .order-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid #eee;padding-top:16px;margin-top:10px}
    .order-total{font-size:20px;font-weight:900}
    .back-btn{display:inline-flex;margin-top:18px}
    .shop-now-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:14px;background:linear-gradient(135deg,#071923,#08789d);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 10px 24px rgba(8,120,157,.22);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
    .shop-now-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(8,120,157,.3);filter:brightness(1.06)}
    .shop-now-btn svg{width:18px;height:18px;transition:transform .2s ease}.shop-now-btn:hover svg{transform:translateX(-3px)}
    .orders-empty{position:relative;overflow:hidden}
    .orders-empty::before{content:"";position:absolute;width:180px;height:180px;left:-80px;top:-90px;border-radius:50%;background:rgba(8,120,157,.07);pointer-events:none}
    .orders-empty>*{position:relative;z-index:1}
    @media(max-width:700px){
      .orders-page{margin:20px auto}
      .orders-card{padding:18px}
      .order-info{grid-template-columns:1fr}
      .order-footer{align-items:flex-start;flex-direction:column}
    }
  .orders-site-header{background:#071923}.orders-brand{gap:10px;text-decoration:none}.orders-brand-logo{font-size:28px;font-weight:1000;letter-spacing:3px;color:#fff;line-height:1}.orders-brand .brand-text{color:#9fb8c2;font-size:9px;letter-spacing:2px}.orders-site-header .nav-actions{gap:8px}.orders-site-header .btn-outline{border-color:rgba(255,255,255,.18);color:#fff;background:rgba(255,255,255,.06)}.orders-site-header .btn-outline:hover{background:rgba(255,255,255,.12)}.orders-site-header .btn-primary{background:#08789d;border-color:#08789d}.orders-site-header .cart-svg{width:20px;height:20px}.orders-site-header .cart-icon-btn{position:relative;display:inline-flex;align-items:center;gap:5px}.orders-site-header .cart-count{min-width:18px;height:18px;display:inline-grid;place-items:center;border-radius:50%;background:#e5484d;color:#fff;font-size:10px;font-weight:900}.orders-site-header .profile-icon{font-size:15px}@media(max-width:700px){.orders-site-header .nav-actions{gap:5px;overflow-x:auto;max-width:70vw}.orders-site-header .nav-actions .btn{white-space:nowrap}.orders-brand .brand-text{display:none}}
  </style>
</head>
<body>
  <header class="site-header orders-site-header">
    <div class="container nav">
      <a class="brand orders-brand" href="index.html" aria-label="OZZI">
        <span class="orders-brand-logo">OZZI</span>
        <span class="brand-text">MORE THAN STORE</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-outline cart-link cart-icon-btn" href="cart.html" aria-label="سلة التسوق" title="السلة">
          <svg class="cart-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="18" cy="20" r="1.6" fill="currentColor"/></svg>
          <span id="cartCount" class="cart-count">0</span>
        </a>
        <a class="btn btn-outline" href="favorites.html">❤️ المفضلة</a>
        <a class="btn btn-outline" href="notifications.html">🔔 الإشعارات</a>
        <a class="btn btn-outline" href="orders.html">📦 طلباتي</a>
        <a class="btn btn-primary profile-btn" href="profile.html"><span class="profile-icon" aria-hidden="true">👤</span><span>الملف الشخصي</span></a>
      </div>
    </div>
  </header>
  <main class="orders-page">
    <section class="orders-header">
      <h1>طلباتي</h1>
      <p>تابع جميع طلباتك وتفاصيل كل طلب وحالته.</p>
    </section>

    <div id="ordersLoading" class="orders-card orders-loading">جاري تحميل طلباتك...</div>

    <div id="ordersError" class="orders-card orders-error" style="display:none"></div>

    <div id="ordersEmpty" class="orders-card orders-empty" style="display:none">
      <h2>لا توجد طلبات حتى الآن</h2>
      <p>ابدأ التسوق وأول طلب لك سيظهر هنا.</p>
      <a class="shop-now-btn" href="index.html">ابدأ التسوق <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
    </div>

    <section id="ordersList" style="display:none"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function () {
      const loading = document.getElementById("ordersLoading");
      const errorBox = document.getElementById("ordersError");
      const empty = document.getElementById("ordersEmpty");
      const list = document.getElementById("ordersList");

      const statusLabels = {
        pending: "قيد المراجعة",
        confirmed: "تم تأكيد الطلب",
        shipped: "تم الشحن",
        delivered: "تم التسليم",
        cancelled: "ملغي"
      };

      function money(value, code="EG") {
        const symbols={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};
        return new Intl.NumberFormat("ar-EG").format(Number(value || 0)) + " " + (symbols[code]||"ج.م");
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
          return ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[char];
        });
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("ar-EG", {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(new Date(value));
      }

      function countryName(code) {
        return ({
          EG: "مصر",
          SA: "السعودية",
          AE: "الإمارات",
          IQ: "العراق",
          OM: "سلطنة عُمان"
        })[code] || code || "—";
      }

      function renderTimeline(status) {
        if(status==="cancelled") return '<div class="order-timeline"><div class="timeline-step done"><div class="timeline-dot">✓</div><div class="timeline-label">تم استلام الطلب</div></div><div class="timeline-step cancelled"><div class="timeline-dot">×</div><div class="timeline-label">تم إلغاء الطلب</div></div></div>';
        const steps=[["pending","تم استلام الطلب"],["confirmed","تم التأكيد"],["shipped","تم الشحن"],["delivered","تم التسليم"]];
        const index=steps.findIndex(x=>x[0]===status);
        return '<div class="order-timeline">'+steps.map((step,i)=>'<div class="timeline-step '+(i<index?"done":i===index?"current":"")+'"><div class="timeline-dot">'+(i<index?"✓":i===index?"●":i+1)+'</div><div class="timeline-label">'+step[1]+'</div></div>').join("")+'</div>';
      }

      function renderOrder(order) {
        const status = order.status || "pending";
        const items = Array.isArray(order.order_items) ? order.order_items : [];

        const itemsHtml = items.length
          ? items.map(item => `
              <div class="order-item">
                <img src="${escapeHtml(item.product_image || "")}" alt="">
                <div class="order-item-info">
                  <div class="order-item-name">${escapeHtml(item.product_name || "منتج")}</div>
                  <div class="order-item-meta">${Number(item.quantity || 0)} × ${money(item.unit_price, order.country_code)}</div>
                </div>
                <div class="order-item-total">${money(Number(item.unit_price||0)*Number(item.quantity||0), order.country_code)}</div>
              </div>
            `).join("")
          : '<p style="color:#777">لا توجد تفاصيل منتجات لهذا الطلب.</p>';

        return `
          <article class="order-card">
            <div class="order-top">
              <div>
                <div class="order-number">طلب #${escapeHtml(order.order_number)}</div>
                <div class="order-date">${escapeHtml(formatDate(order.created_at))}</div>
              </div>
              <span class="order-status status-${escapeHtml(status)}">
                ${escapeHtml(statusLabels[status] || status)}
              </span>
            </div>

            ${renderTimeline(status)}

            <div class="order-updated">آخر تحديث: ${escapeHtml(formatDate(order.updated_at || order.created_at))}</div>

            <div class="order-info">
              <div>
                <span>العميل</span>
                <strong>${escapeHtml(order.customer_name)}</strong>
              </div>
              <div>
                <span>الهاتف</span>
                <strong>${escapeHtml(order.phone || "—")}</strong>
              </div>
              <div>
                <span>الدولة</span>
                <strong>${escapeHtml(countryName(order.country_code))}</strong>
              </div>
              <div>
                <span>طريقة الدفع</span>
                <strong>${order.payment_method === "cod" ? "الدفع عند الاستلام" : escapeHtml(order.payment_method)}</strong>
              </div>
              <div style="grid-column:span 2">
                <span>العنوان</span>
                <strong>—</strong>
              </div>
            </div>

            <div class="order-items">
              <strong>المنتجات</strong>
              ${itemsHtml}
            </div>

            

            <div class="order-footer">
              <div>
                <span style="display:block;color:#777;font-size:13px">إجمالي الطلب</span>
                <div class="order-total">${money(order.total, order.country_code)}</div>
              </div>
              <a class="btn btn-outline" href="index.html">العودة للتسوق</a>
            </div>
          </article>
        `;
      }

      try {
        const sb = window.ozziGetSupabase();
        const { data: sessionData, error: sessionError } = await sb.auth.getSession();

        if (sessionError || !sessionData.session) {
          window.location.replace("login.html?next=orders.html");
          return;
        }

        const user = sessionData.session.user;

        const { data: orders, error: ordersError } = await sb
          .from("orders")
          .select(`
            id,
            order_number,
            customer_name,
            country_code,
            payment_method,
            status,
            total,
            created_at,
            updated_at,
            order_items (
              id,
              product_id,
              product_name,
              unit_price,
              quantity
            )
          `)
          .eq("user_id", user.id)
          .order("created_at", { ascending: false });

        if (ordersError) throw ordersError;

        loading.style.display = "none";

        if (!orders || !orders.length) {
          empty.style.display = "block";
          return;
        }

        function renderOrders(){list.innerHTML = orders.map(renderOrder).join("");list.style.display="block";}
        renderOrders();

        sb.channel("ozzi-orders-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"orders",filter:"user_id=eq."+user.id},payload=>{
          const index=orders.findIndex(o=>o.id===payload.new.id);
          if(index>=0){orders[index]={...orders[index],...payload.new};renderOrders();}
        }).subscribe();
      } catch (err) {
        console.error("OZZI ORDERS ERROR:", err);
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.innerHTML =
          "<strong>حدث خطأ أثناء تحميل الطلبات.</strong><br>" +
          escapeHtml(err.message || "حاول تحديث الصفحة مرة أخرى.");
      }
    })();
  </script>
</body>
</html>
