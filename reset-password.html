<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور | OZZI</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<main class="auth-page"><section class="auth-card">
<div class="auth-logo">OZZI</div><p class="auth-slogan">More than store</p>
<h1>تعيين كلمة مرور جديدة</h1>
<p class="auth-description">اكتب كلمة المرور الجديدة لحسابك.</p>
<form id="resetForm">
<div class="form-group"><label for="newPassword">كلمة المرور الجديدة</label><input id="newPassword" type="password" placeholder="********" autocomplete="new-password" minlength="8" required></div>
<div class="form-group"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" placeholder="********" autocomplete="new-password" minlength="8" required></div>
<button type="submit" class="auth-button" id="resetButton">حفظ كلمة المرور</button>
<p id="resetMessage" class="auth-message"></p>
</form>
<a href="index.html" class="back-home">العودة إلى المتجر</a>
</section></main>
<script>
document.getElementById("resetForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const password=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  const btn=document.getElementById("resetButton");
  const msg=document.getElementById("resetMessage");
  if(password.length<8){msg.textContent="كلمة المرور يجب أن تكون 8 أحرف على الأقل.";return;}
  if(password!==confirm){msg.textContent="كلمتا المرور غير متطابقتين.";return;}
  btn.disabled=true;
  btn.textContent="جاري الحفظ...";
  try{
    const sb=window.ozziGetSupabase();
    const {error}=await sb.auth.updateUser({password});
    if(error) throw error;
    msg.textContent="تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.";
    msg.className="auth-message success";
    setTimeout(()=>window.location.replace("login.html"),1200);
  }catch(error){
    console.error("OZZI Password Reset Error:",error);
    msg.textContent="انتهت صلاحية رابط إعادة التعيين أو حدث خطأ. اطلب رابطًا جديدًا.";
  }finally{
    btn.disabled=false;
    btn.textContent="حفظ كلمة المرور";
  }
});
</script>
</body>
</html>
