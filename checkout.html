<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب | OZZI</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-page{max-width:1100px;margin:40px auto;padding:0 20px}
    .checkout-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}
    .checkout-card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
    .checkout-card h1,.checkout-card h2{margin-top:0}
    .checkout-form{display:grid;gap:14px}
    .checkout-form label{font-weight:700}
    .checkout-form input,.checkout-form textarea,.checkout-form select{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #ddd;border-radius:12px;font:inherit}
    .checkout-form textarea{min-height:100px;resize:vertical}
    .checkout-summary-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
    .checkout-summary-item img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#f5f5f5}
    .checkout-summary-item .info{flex:1}
    .checkout-summary-item .name{font-weight:700}
    .checkout-summary-item .meta{font-size:13px;color:#777;margin-top:4px}
    .checkout-subtotal,.checkout-shipping,.checkout-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
    .checkout-shipping{color:#067647;font-weight:700}
    .checkout-shipping .free-badge{font-size:13px;background:#effcf6;padding:5px 9px;border-radius:8px}
    .checkout-total{font-size:20px;font-weight:800;padding-top:14px;border-top:1px solid #eee}
    .checkout-submit{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:800;background:#111;color:#fff}
    .checkout-submit:disabled{opacity:.6;cursor:not-allowed}
    .checkout-message{margin-top:14px;padding:12px;border-radius:10px;display:none}
    .checkout-message.error{display:block;background:#fff1f1;color:#b42318}
    .checkout-message.success{display:block;background:#effcf6;color:#067647}
    .empty-checkout{text-align:center;padding:50px 20px}
    .account-country{padding:13px 14px;border:1px solid #ddd;border-radius:12px;background:#f7f7f7;color:#555;font-weight:700}
    @media(max-width:800px){.checkout-grid{grid-template-columns:1fr}.checkout-page{margin:20px auto}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a class="logo" href="index.html">OZZI</a>
        <div class="nav-actions">
          <a class="btn btn-outline" href="cart.html">🛒 السلة</a>
          <a class="btn btn-primary" href="profile.html">الملف الشخصي</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="checkout-page">
    <div id="loadingState" class="checkout-card">جاري تجهيز الطلب...</div>

    <div id="emptyState" class="checkout-card empty-checkout" style="display:none">
      <h1>السلة فارغة</h1>
      <p>أضف منتجات إلى السلة أولًا لإتمام الطلب.</p>
      <a class="btn btn-primary" href="index.html">العودة للتسوق</a>
    </div>

    <div id="checkoutContent" style="display:none">
      <div class="checkout-grid">
        <section class="checkout-card">
          <h1>إتمام الطلب</h1>
          <p>بيانات التوصيل</p>
          <form id="checkoutForm" class="checkout-form">
            <div>
              <label for="fullName">الاسم بالكامل</label>
              <input id="fullName" required>
            </div>
            <div>
              <label for="phone">رقم الهاتف</label>
              <input id="phone" type="tel" required>
            </div>
            <div>
              <label>الدولة</label>
              <div id="accountCountry" class="account-country" aria-live="polite">جاري تحديد الدولة...</div>
            </div>
            <div>
              <label for="address">العنوان بالتفصيل</label>
              <textarea id="address" placeholder="المحافظة، المنطقة، الشارع، رقم المبنى..." required></textarea>
            </div>
            <div>
              <label for="notes">ملاحظات إضافية</label>
              <textarea id="notes" placeholder="أي ملاحظات خاصة بالطلب (اختياري)"></textarea>
            </div>
            <div>
              <label for="payment">طريقة الدفع</label>
              <select id="payment" required>
                <option value="cod">الدفع عند الاستلام</option>
              </select>
            </div>
            <button id="submitOrder" class="checkout-submit" type="submit">تأكيد الطلب</button>
            <div id="checkoutMessage" class="checkout-message"></div>
          </form>
        </section>

        <aside class="checkout-card">
          <h2>ملخص الطلب</h2>
          <div id="summaryItems"></div>

          <div class="checkout-subtotal">
            <span>قيمة المنتجات</span>
            <strong id="summarySubtotal">0 ج.م</strong>
          </div>

          <div class="checkout-shipping">
            <span>الشحن</span>
            <span class="free-badge">مجاني لفترة محدودة</span>
          </div>

          <div class="checkout-total">
            <span>الإجمالي النهائي</span>
            <span id="summaryTotal">0 ج.م</span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    (async function () {
      const loading = document.getElementById("loadingState");
      const empty = document.getElementById("emptyState");
      const content = document.getElementById("checkoutContent");
      const itemsBox = document.getElementById("summaryItems");
      const subtotalBox = document.getElementById("summarySubtotal");
      const totalBox = document.getElementById("summaryTotal");
      const form = document.getElementById("checkoutForm");
      const message = document.getElementById("checkoutMessage");
      const submit = document.getElementById("submitOrder");
      const accountCountry = document.getElementById("accountCountry");

      const countries = {
        EG: "مصر",
        SA: "السعودية",
        AE: "الإمارات",
        IQ: "العراق",
        OM: "سلطنة عُمان"
      };

      const shippingCost = 0;

      const currencySymbols = {EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};
      function money(value) {
        return new Intl.NumberFormat("ar-EG").format(Math.round(Number(value)||0)) + " " + (currencySymbols[countryCode] || "ج.م");
      }

      function setMessage(text, type) {
        message.className = "checkout-message " + type;
        message.textContent = text;
      }

      try {
        const sb = window.ozziGetSupabase();
        const { data, error } = await sb.auth.getSession();

        if (error || !data.session) {
          window.location.replace("login.html?next=checkout.html");
          return;
        }

        const user = data.session.user;
        const meta = user.user_metadata || {};
        const countryCode = String(meta.country_code || "").toUpperCase();
        const countryName = countries[countryCode];

        if (!countryName) {
          throw new Error("لا توجد دولة مرتبطة بهذا الحساب. يرجى تحديث بيانات الحساب.");
        }

        document.getElementById("fullName").value = meta.full_name || "";
        document.getElementById("phone").value = meta.phone || "";
        accountCountry.textContent = countryName;

        const cart = window.ozziCart.getCart();

        if (!cart.length) {
          loading.style.display = "none";
          empty.style.display = "block";
          return;
        }

        let subtotal = 0;

        itemsBox.innerHTML = cart.map(item => {
          const price = Number(item.price || 0);
          const qty = Number(item.quantity || 1);
          subtotal += price * qty;

          return `
            <div class="checkout-summary-item">
              <img src="${item.image || ""}" alt="">
              <div class="info">
                <div class="name">${item.name || "منتج"}</div>
                <div class="meta">${qty} × ${money(price)}</div>
              </div>
              <strong>${money(price * qty)}</strong>
            </div>
          `;
        }).join("");

        const total = subtotal + shippingCost;

        subtotalBox.textContent = money(subtotal);
        totalBox.textContent = money(total);
        loading.style.display = "none";
        content.style.display = "block";

        form.addEventListener("submit", async function (event) {
          event.preventDefault();

          message.className = "checkout-message";
          message.textContent = "";
          submit.disabled = true;
          submit.textContent = "جاري حفظ الطلب...";

          try {
            const name = document.getElementById("fullName").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();
            const notes = document.getElementById("notes").value.trim();
            const paymentMethod = document.getElementById("payment").value;

            if (!name || !phone || !address) {
              throw new Error("من فضلك أكمل بيانات التوصيل.");
            }

            const orderPayload = {
              user_id: user.id,
              customer_name: name,
              phone,
              country_code: countryCode,
              address,
              notes: notes || null,
              payment_method: paymentMethod,
              status: "pending",
              total
            };

            const { data: order, error: orderError } = await sb
              .from("orders")
              .insert(orderPayload)
              .select("id, order_number")
              .single();

            if (orderError) throw orderError;
            if (!order) throw new Error("تعذر إنشاء الطلب.");

            const orderItems = cart.map(item => ({
              order_id: order.id,
              product_id: String(item.id),
              product_name: item.name || "منتج",
              product_image: item.image || null,
              unit_price: Number(item.price || 0),
              quantity: Number(item.quantity || 1)
            }));

            const { error: itemsError } = await sb
              .from("order_items")
              .insert(orderItems);

            if (itemsError) throw itemsError;

            const lines = cart.map((item, index) =>
              (index + 1) + "- " + (item.name || "منتج") + " × " +
              Number(item.quantity || 1) + " = " +
              money(Number(item.price || 0) * Number(item.quantity || 1))
            );

            const orderText =
              "طلب جديد من OZZI\n\n" +
              "رقم الطلب: #" + order.order_number + "\n" +
              "العميل: " + name + "\n" +
              "الهاتف: " + phone + "\n" +
              "الدولة: " + countryName + "\n" +
              "العنوان: " + address + "\n" +
              (notes ? "ملاحظات: " + notes + "\n" : "") +
              "\nالمنتجات:\n" + lines.join("\n") +
              "\n\nقيمة المنتجات: " + money(subtotal) +
              "\nالشحن: مجاني لفترة محدودة" +
              "\nالإجمالي النهائي: " + money(total) +
              "\nطريقة الدفع: الدفع عند الاستلام";

            localStorage.setItem("ozzi_last_order", JSON.stringify({
              id: order.id,
              order_number: order.order_number,
              user_id: user.id,
              customer_name: name,
              phone,
              country_code: countryCode,
              address,
              notes,
              subtotal,
              shipping_cost: shippingCost,
              total,
              items: cart,
              created_at: new Date().toISOString()
            }));

            window.ozziCart.clearCart();

            setMessage(
              "تم حفظ الطلب بنجاح. رقم الطلب: #" + order.order_number +
              " — سيتم تحويلك إلى واتساب لتأكيده.",
              "success"
            );

            submit.textContent = "تم حفظ الطلب ✓";

            const whatsappUrl =
              "https://wa.me/201013532567?text=" +
              encodeURIComponent(orderText);

            window.open(whatsappUrl, "_blank");

            setTimeout(function () {
              window.location.replace("index.html?order=success&order_number=" + encodeURIComponent(order.order_number));
            }, 1200);

          } catch (err) {
            console.error("OZZI ORDER ERROR:", err);
            setMessage(
              err.message || "حدث خطأ أثناء حفظ الطلب. حاول مرة أخرى.",
              "error"
            );
            submit.disabled = false;
            submit.textContent = "تأكيد الطلب";
          }
        });

      } catch (err) {
        console.error("OZZI CHECKOUT ERROR:", err);
        loading.textContent = "حدث خطأ أثناء تجهيز صفحة الطلب. حاول مرة أخرى.";
      }
    })();
  </script>
</body>
</html>
