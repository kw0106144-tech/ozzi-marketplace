<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المفضلة | OZZI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css">
<style>
body{background:#f5f7f8}
.favorites-page{padding:32px 0 70px}
.favorites-wrap{max-width:1180px;margin:auto}
.favorites-card{background:#fff;border:1px solid #e5e9ec;border-radius:24px;box-shadow:0 16px 45px rgba(7,25,35,.08);padding:26px}
.favorites-head{margin-bottom:24px}
.favorites-head h1{margin:0;color:#071923;font-size:30px;font-weight:900}
.favorites-head p{margin:7px 0 0;color:#7a858b;font-size:13px}
.favorites-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.favorite-card{position:relative;background:#fff;border:1px solid #e6ebee;border-radius:18px;overflow:hidden;transition:.18s;box-shadow:0 8px 24px rgba(7,25,35,.05)}
.favorite-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(7,25,35,.1)}
.favorite-main{display:block;color:inherit;text-decoration:none}
.favorite-image{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f2f5f6;display:block}
.favorite-info{padding:14px}
.favorite-name{font-weight:900;color:#071923;font-size:14px;line-height:1.6;min-height:44px}
.favorite-price{margin-top:9px;color:#0784a9;font-size:17px;font-weight:900}
.favorite-old{text-decoration:line-through;color:#9aa3a8;font-size:12px;margin-right:7px}
.favorite-remove{position:absolute;top:10px;left:10px;z-index:2;width:38px;height:38px;border:0;border-radius:12px;background:#fff;color:#e5484d;box-shadow:0 5px 16px rgba(0,0,0,.12);cursor:pointer;font-size:20px;font-weight:900}
.favorite-remove:hover{background:#e5484d;color:#fff}
.empty,.error{text-align:center;padding:70px 20px;color:#7b858b;grid-column:1/-1}
.error{color:#b42318}
@media(max-width:1000px){.favorites-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.favorites-page{padding:18px 0 45px}.favorites-card{padding:17px;border-radius:20px}.favorites-head h1{font-size:24px}.favorites-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.favorite-info{padding:11px}.favorite-name{font-size:13px}.favorite-price{font-size:15px}.favorite-remove{width:34px;height:34px}}
</style>
</head>
<body>
<header class="site-header">
 <div class="container nav">
  <a class="brand" href="index.html" aria-label="OZZI">
   <span class="brand-text">OZZI</span><span class="brand-text">MORE THAN STORE</span>
  </a>
  <div class="nav-actions">
   <a class="btn btn-outline cart-link cart-icon-btn" href="cart.html" aria-label="سلة التسوق">🛒 <span id="cartCount" class="cart-count">0</span></a>
   <a class="btn btn-outline" href="orders.html">📦 طلباتي</a>
   <a class="btn btn-outline" href="favorites.html">❤️ المفضلة</a>
   <a class="btn btn-primary" href="notifications.html">🔔 الإشعارات</a>
   <a class="btn btn-primary" href="profile.html">👤 الملف الشخصي</a>
  </div>
 </div>
</header>

<main class="container favorites-page">
 <div class="favorites-wrap">
  <section class="favorites-card">
   <div class="favorites-head">
    <h1>❤️ المفضلة</h1>
    <p>المنتجات التي حفظتها للرجوع إليها لاحقًا.</p>
   </div>
   <div id="favoritesGrid" class="favorites-grid">
    <div class="empty">جاري تحميل المفضلة...</div>
   </div>
  </section>
 </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function(){
 const grid=document.getElementById("favoritesGrid");
 try{
  const sb=window.ozziGetSupabase();
  const sessionResult=await sb.auth.getSession();
  const session=sessionResult.data.session;
  if(!session){
   grid.innerHTML='<div class="empty">يجب تسجيل الدخول لعرض المفضلة.</div>';
   return;
  }

  const result=await sb.from("favorites")
   .select("product_id,products(id,name,name_ar,price,original_price,image_url,active,stock,country_code)")
   .eq("user_id",session.user.id);

  if(result.error) throw result.error;

  const items=(result.data||[])
   .map(function(row){return row.products;})
   .filter(function(product){return product && product.active && Number(product.stock)>0;});

  if(!items.length){
   grid.innerHTML='<div class="empty"><div style="font-size:48px">❤️</div><div>لا توجد منتجات في المفضلة.</div></div>';
   return;
  }

  const currency={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};

  grid.innerHTML=items.map(function(p){
   const name=p.name_ar||p.name||"منتج";
   const price=Number(p.price)||0;
   const old=Number(p.original_price)||0;
   const symbol=currency[String(p.country_code||"EG").toUpperCase()]||"ج.م";
   const image=p.image_url||"";
   return '<article class="favorite-card">'+
    '<button class="favorite-remove" type="button" data-remove="'+String(p.id).replace(/"/g,"&quot;")+'" aria-label="إزالة من المفضلة">♥</button>'+
    '<a class="favorite-main" href="product.html?id='+encodeURIComponent(p.id)+'">'+
     (image?'<img class="favorite-image" src="'+image.replace(/"/g,"&quot;")+'" alt="">':'<div class="favorite-image"></div>')+
     '<div class="favorite-info">'+
      '<div class="favorite-name">'+escapeHtml(name)+'</div>'+
      '<div class="favorite-price">'+new Intl.NumberFormat("ar-EG").format(price)+" "+symbol+(old>price?'<span class="favorite-old">'+new Intl.NumberFormat("ar-EG").format(old)+" "+symbol+"</span>":"")+'</div>'+
     '</div>'+
    '</a>'+
   '</article>';
  }).join("");

  grid.querySelectorAll("[data-remove]").forEach(function(button){
   button.addEventListener("click",async function(event){
    event.preventDefault();
    event.stopPropagation();
    button.disabled=true;
    try{
     const r=await sb.from("favorites").delete().eq("user_id",session.user.id).eq("product_id",button.dataset.remove);
     if(r.error) throw r.error;
     const card=button.closest(".favorite-card");
     if(card) card.remove();
     if(!grid.querySelector(".favorite-card")){
      grid.innerHTML='<div class="empty"><div style="font-size:48px">❤️</div><div>لا توجد منتجات في المفضلة.</div></div>';
     }
    }catch(e){
     console.error("Favorite remove error:",e);
     button.disabled=false;
     alert("تعذر إزالة المنتج من المفضلة.");
    }
   });
  });
 }catch(e){
  console.error("Favorites page error:",e);
  grid.innerHTML='<div class="error">تعذر تحميل المفضلة. حاول تحديث الصفحة.</div>';
 }

 function escapeHtml(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
 }
});
</script>
</body>
</html>
