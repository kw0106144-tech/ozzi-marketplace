<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفضلاتي - OZZI</title><link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/header.css"><style>body{font-family:Tajawal,Arial,sans-serif;font-weight:900}.favorites-wrap{max-width:1200px;margin:30px auto;padding:0 18px}.fav-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.fav-head h1{margin:0}.favorites-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.fav-card{position:relative;border:1px solid #e8ecef;border-radius:18px;overflow:hidden;background:#fff;text-decoration:none;color:inherit}.fav-img{height:220px;background:#f7f9fa;display:grid;place-items:center}.fav-img img{width:100%;height:100%;object-fit:cover}.fav-body{padding:14px}.fav-name{margin-bottom:8px}.fav-price{font-size:18px}.fav-remove{position:absolute;top:10px;left:10px;border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:#d92d20;box-shadow:0 4px 14px #0002;cursor:pointer;font-size:20px}.fav-empty{padding:55px;text-align:center;border:1px dashed #ccd5da;border-radius:18px}@media(max-width:900px){.favorites-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.favorites-grid{grid-template-columns:1fr}}</style></head><body><header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="OZZI">
      <span style="font-weight:1000;font-size:32px;letter-spacing:2px;color:#fff">OZZI</span>
      <span class="brand-text">MORE THAN STORE</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-outline cart-icon-btn" href="cart.html" aria-label="سلة التسوق" title="السلة">
        <svg class="cart-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.6" fill="currentColor"/><circle cx="18" cy="20" r="1.6" fill="currentColor"/></svg>
        <span id="cartCount" class="cart-count">0</span>
      </a>
      <a class="btn btn-outline" href="favorites.html">❤️ المفضلة</a>
      <a class="btn btn-outline" href="notifications.html">🔔 الإشعارات <span data-notification-count style="display:none;margin-right:5px;padding:2px 7px;border-radius:999px;background:#e5484d;color:#fff;font-size:11px">0</span></a>
      <a class="btn btn-outline" href="orders.html">📦 طلباتي</a>
      <a class="btn btn-outline" href="index.html">المتجر</a>
    </div>
  </div>
</header><main class="favorites-wrap"><div class="fav-head"><div><h1>❤️ منتجاتي المفضلة</h1><p class="muted">المنتجات التي حفظتها للرجوع إليها لاحقًا</p></div></div><div id="favoritesGrid" class="favorites-grid"><div class="fav-empty">جاري تحميل المفضلة...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/favorites.js"></script><script>
(async()=>{const grid=document.getElementById("favoritesGrid");try{const sb=window.ozziGetSupabase();const {data:session}=await sb.auth.getSession();if(!session.session){grid.innerHTML='<div class="fav-empty">سجّل الدخول أولًا لعرض مفضلاتك.<br><br><a href="login.html">تسجيل الدخول</a></div>';return}const {data,error}=await sb.from("favorites").select("product_id,products(id,name,name_ar,category,price,original_price,image_url,country_code,active,stock)").eq("user_id",session.session.user.id);if(error)throw error;const items=(data||[]).map(x=>x.products).filter(Boolean).filter(p=>p.active&&p.stock>0);if(!items.length){grid.innerHTML='<div class="fav-empty">❤️ لا توجد منتجات في المفضلة حاليًا.</div>';return}const symbols={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};const money=v=>new Intl.NumberFormat("ar-EG",{maximumFractionDigits:0}).format(Math.round(Number(v)||0));grid.innerHTML=items.map(p=>{const n=p.name_ar||p.name||"منتج";return '<a class="fav-card" href="product.html?id='+encodeURIComponent(p.id)+'"><button class="fav-remove" data-remove="'+p.id+'" type="button" aria-label="إزالة من المفضلة">♥</button><div class="fav-img">'+(p.image_url?'<img src="'+p.image_url.replace(/"/g,"&quot;")+'" alt="">':'🛍️')+'</div><div class="fav-body"><div class="fav-name">'+n+'</div><div class="fav-price">'+money(p.price)+" "+(symbols[p.country_code]||"ج.م")+'</div></div></a>'}).join("");grid.querySelectorAll("[data-remove]").forEach(b=>b.onclick=async e=>{e.preventDefault();await window.ozziFavorites.toggle(b.dataset.remove);b.closest(".fav-card").remove();});}catch(e){console.error(e);grid.innerHTML='<div class="fav-empty">تعذر تحميل المفضلة.</div>';}})();</script></body></html>
