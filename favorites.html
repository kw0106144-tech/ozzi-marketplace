<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المفضلة | OZZI</title>
<link rel="stylesheet" href="css/style.css?v=20260923">
<link rel="stylesheet" href="css/header.css?v=20260923">
<style>
body{background:#f6f8fa}
.favorites-page{width:min(1100px,calc(100% - 32px));margin:38px auto 60px}
.favorites-card{background:#fff;border:1px solid #e6eaed;border-radius:24px;padding:26px;box-shadow:0 12px 35px rgba(7,25,35,.06)}
.favorites-heading{margin-bottom:24px}
.favorites-heading h1{margin:0;color:#071923;font-size:32px;font-weight:900}
.favorites-heading p{margin:7px 0 0;color:#737d83;font-size:13px}
.favorites-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.favorite-item{position:relative;overflow:hidden;background:#fff;border:1px solid #e4e8eb;border-radius:18px;transition:.18s}
.favorite-item:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(7,25,35,.09)}
.favorite-link{display:block;color:inherit;text-decoration:none}
.favorite-image{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;background:#f2f5f6}
.favorite-info{padding:14px}
.favorite-name{min-height:45px;font-weight:900;line-height:1.6;color:#071923}
.favorite-price{margin-top:7px;color:#0784a9;font-size:17px;font-weight:900}
.favorite-old{margin-right:7px;color:#999;font-size:11px;text-decoration:line-through;font-weight:700}
.favorite-remove{position:absolute;top:10px;left:10px;z-index:5;width:40px;height:40px;border:0;border-radius:12px;background:#fff;color:#e5484d;box-shadow:0 4px 16px rgba(0,0,0,.15);cursor:pointer;font-size:21px;font-weight:900}
.favorite-remove:disabled{opacity:.5;cursor:wait}
.page-state{grid-column:1/-1;text-align:center;padding:70px 20px;color:#7b858b}
.page-state .state-icon{font-size:50px;margin-bottom:10px}
.page-state strong{display:block;color:#071923;font-size:19px;margin-bottom:7px}
.page-state a{display:inline-flex;margin-top:18px;padding:11px 18px;border-radius:12px;background:#071923;color:#fff;text-decoration:none;font-weight:900}
@media(max-width:1000px){.favorites-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.favorites-page{width:min(100% - 20px,1100px);margin:22px auto 40px}.favorites-card{padding:17px}.favorites-heading h1{font-size:27px}.favorites-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(max-width:650px){.favorites-page{padding:14px 10px!important}.favorites-card{border-radius:16px!important;padding:15px!important}.favorites-heading h1{font-size:22px!important}.favorites-heading p{font-size:12px!important}.favorites-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.favorite-item{border-radius:14px!important}.favorite-image{height:150px!important}.favorite-name{font-size:13px!important}.favorite-price{font-size:13px!important}}
</style>
</head>
<body>
<header class="site-header">
<div class="container nav">
<a class="brand" href="index.html" aria-label="OZZI">
<span class="brand-text">OZZI</span>
<span class="brand-text">MORE THAN STORE</span>
</a>
<button class="mobile-menu-toggle" type="button" aria-label="فتح قائمة الموقع" aria-expanded="false" aria-controls="ozziMobileMenu"><span></span><span></span><span></span></button><div class="mobile-menu-panel" id="ozziMobileMenu"><div class="nav-actions">
<a class="btn btn-outline cart-link cart-icon-btn" href="cart.html" aria-label="السلة" title="السلة">🛒 <span id="cartCount" class="cart-count">0</span></a>
<a class="btn btn-outline" href="orders.html">📦 طلباتي</a>
<a class="btn btn-primary" href="favorites.html">❤️ المفضلة</a>
<a class="btn btn-outline" href="notifications.html">🔔 الإشعارات</a>
<a class="btn btn-primary" href="profile.html">👤 الملف الشخصي</a>
</div></div>
</div>
</header>

<main class="favorites-page">
<section class="favorites-card">
<div class="favorites-heading">
<h1>❤️ المفضلة</h1>
<p>المنتجات التي حفظتها للرجوع إليها لاحقًا</p>
</div>
<div id="favoritesGrid" class="favorites-grid">
<div class="page-state"><div>جاري تحميل المفضلة...</div></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260923"></script>
<script>
// Favorites page is intentionally independent from orders/customer fields.
// It must never query the orders table.

(function(){
"use strict";
var sb=null,uid=null;
var grid=document.getElementById("favoritesGrid");
var currency={EG:"ج.م",SA:"ر.س",AE:"د.إ",IQ:"ع.ع",OM:"ر.ع"};

function escapeHtml(value){
return String(value==null?"":value).replace(/[&<>"']/g,function(ch){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch];
});
}
function money(value,code){
return new Intl.NumberFormat("ar-EG").format(Number(value)||0)+" "+(currency[code]||"ج.م");
}
function state(title,text,button){
grid.innerHTML='<div class="page-state"><div class="state-icon">❤️</div><strong>'+escapeHtml(title)+'</strong><div>'+escapeHtml(text||"")+'</div>'+(button?'<a href="index.html">تصفح المنتجات</a>':"")+'</div>';
}
async function loadFavorites(){
var sessionResult=await sb.auth.getSession();
if(sessionResult.error)throw sessionResult.error;
var session=sessionResult.data.session;
if(!session){
state("سجل الدخول أولًا","يجب تسجيل الدخول لعرض المنتجات المحفوظة.",false);
return;
}
uid=session.user.id;

var favoritesResult=await sb.from("favorites").select("product_id").eq("user_id",uid);
if(favoritesResult.error)throw favoritesResult.error;

var ids=(favoritesResult.data||[]).map(function(row){return row.product_id;}).filter(Boolean);
if(!ids.length){
state("لا توجد منتجات في المفضلة","أضف أي منتج للمفضلة وسيظهر هنا.",true);
return;
}

var productsResult=await sb.from("products")
.select("id,name,name_ar,price,original_price,image_url,active,stock,country_code")
.in("id",ids);
if(productsResult.error)throw productsResult.error;

var products=(productsResult.data||[]).filter(function(product){
return product.active===true&&Number(product.stock)>0;
});

if(!products.length){
state("لا توجد منتجات متاحة","المنتجات المحفوظة غير متاحة حاليًا.",true);
return;
}

grid.innerHTML=products.map(function(product){
var id=escapeHtml(product.id);
var name=escapeHtml(product.name_ar||product.name||"منتج");
var image=escapeHtml(product.image_url||"");
var code=String(product.country_code||"EG").toUpperCase();
var price=Number(product.price)||0;
var old=Number(product.original_price)||0;
return '<article class="favorite-item" data-product-id="'+id+'">'+
'<button class="favorite-remove" type="button" data-remove-id="'+id+'" aria-label="إزالة من المفضلة">♥</button>'+
'<a class="favorite-link" href="product.html?id='+encodeURIComponent(product.id)+'">'+
(image?'<img class="favorite-image" src="'+image+'" alt="'+name+'" loading="lazy">':'<div class="favorite-image"></div>')+
'<div class="favorite-info"><div class="favorite-name">'+name+'</div><div class="favorite-price">'+money(price,code)+(old>price?'<span class="favorite-old">'+money(old,code)+'</span>':"")+'</div></div>'+
'</a></article>';
}).join("");

grid.querySelectorAll("[data-remove-id]").forEach(function(button){
button.addEventListener("click",async function(event){
event.preventDefault();
event.stopPropagation();
button.disabled=true;
try{
var id=button.getAttribute("data-remove-id");
var result=await sb.from("favorites").delete().eq("user_id",uid).eq("product_id",id);
if(result.error)throw result.error;
var item=button.closest(".favorite-item");
if(item)item.remove();
if(!grid.querySelector(".favorite-item"))state("لا توجد منتجات في المفضلة","أضف أي منتج للمفضلة وسيظهر هنا.",true);
}catch(error){
console.error("OZZI FAVORITES REMOVE ERROR:",error);
button.disabled=false;
alert("تعذر إزالة المنتج من المفضلة.");
}
});
});
}
async function init(){
try{
if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY)throw new Error("Supabase config missing");
sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"ozzi-auth"}});
await loadFavorites();
}catch(error){
console.error("OZZI FAVORITES ERROR:",error);
grid.innerHTML='<div class="page-state"><div class="state-icon">⚠️</div><strong>تعذر تحميل المفضلة</strong><div>تأكد من تسجيل الدخول وإعداد قاعدة البيانات.</div><a href="index.html">العودة للمتجر</a></div>';
}
}
document.addEventListener("DOMContentLoaded",init);
})();
</script>
<script src="js/mobile-header.js"></script></body>
</html>
